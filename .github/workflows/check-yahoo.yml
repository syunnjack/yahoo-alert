name: Check Yahoo

on:
  schedule:
    - cron: '30 22 * * *'   # 毎日 07:30 JST
  workflow_dispatch:
    inputs:
      top_n:
        description: '上位何件を見るか'
        type: string
        default: '30'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 売れ筋を見る
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          TOP_N: ${{ inputs.top_n || '30' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/check_yahoo.py
      - name: 変化があれば commit する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "変化はありませんでした。"
          else
            git commit -m "売れ筋の順位を記録する"
            git pull --rebase --autostash origin main && git push
          fi
